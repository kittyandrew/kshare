name: build

# Runs after merge, never on a PR: this is an operator-only repo, so a broken flake is cheaper to revert
# than to gate every PR on Nix. Publishing to cache.kittyandrew.dev is Circus's job, not CI's.

on:
  push:
    branches: [main]

permissions:
  contents: read # checking out is all any step needs; nothing writes back

jobs:
  nix:
    name: nix check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no later step uses git; else the token sits in .git/config
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
      - run: nix flake check
      - run: nix build .#kshared-image
