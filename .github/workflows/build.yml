name: build

# Runs after merge, never on a PR: this is an operator-only repo, so a broken flake is cheaper to revert
# than to gate every PR on Nix. Publishing to cache.kittyandrew.dev is Circus's job, not CI's.

on:
  push:
    branches: [main]

jobs:
  nix:
    name: nix check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check
      - run: nix build .#kshared-image
