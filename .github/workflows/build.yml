name: build

# Runs after merge, never on a PR: that keeps the Attic push token out of any workflow a fork can trigger,
# and this is an operator-only repo, so a broken flake is cheaper to revert than to gate every PR on Nix.
# Token provenance: `.claude/rules/selfhosted/202-attic.md` in github.com/kittyandrew/kittyos.

on:
  push:
    branches: [main]

jobs:
  nix:
    name: nix check + build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      # attic-action installs a post-build hook BEFORE the build step, so any derivation produced by
      # `nix flake check` + `nix build` below is pushed automatically; no separate `attic push` call.
      - name: setup attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_ENDPOINT }}
          cache: general
          token: ${{ secrets.ATTIC_GENERAL_PUSH_TOKEN }}
      - run: nix flake check
      - run: nix build .#kshared-image
