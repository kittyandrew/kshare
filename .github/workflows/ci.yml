name: ci

# Go gates only. Nix and the Attic push live in build.yml, so this workflow needs no secrets and fork PRs
# run against it safely.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # gofmt has no exit code of its own: it lists offenders and returns 0, so turn a non-empty list into a
      # failure. Without this the tree drifts out of format and nothing notices.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - run: go build ./...
