name: ci

# Go-side code-quality gates. Runs on every PR and every push to main.
# Nix evaluation + OCI image build + Attic cache push live in
# build.yml, main-branch only -- keeps PR runtime tight and isolates
# the Attic push token from fork-PR contexts.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - run: go build ./...
