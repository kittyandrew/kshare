name: ci

# Go gates only. Nix lives in build.yml, so this workflow needs no secrets and fork PRs
# run against it safely.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # checking out is all any step needs; nothing writes back

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no later step uses git; else the token sits in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # gofmt has no exit code of its own: it lists offenders and returns 0, so turn a non-empty list into a
      # failure. Without this the tree drifts out of format and nothing notices.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - run: go build ./...
